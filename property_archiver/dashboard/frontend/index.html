<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Archiver - Unified Dashboard</title>
    
    <!-- External Leaflet Map Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Modular Application CSS Entry Point -->
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Property Archiver <span>Dashboard</span>
        </div>
        <div class="header-actions">
            <button id="btn-open-compare" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
                Compare Listings
            </button>
            <div class="view-toggle">
                <button id="btn-view-grid" class="view-btn active" data-view="grid">Grid</button>
                <button id="btn-view-grouped" class="view-btn" data-view="grouped">Grouped</button>
                <button id="btn-view-map" class="view-btn" data-view="map">Map</button>
            </div>
            <button id="btn-open-export" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export
            </button>
            <button id="btn-open-archive" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Archive Listing
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Top Metrics Counters -->
        <section id="metrics-container" class="metrics-grid"></section>

        <!-- Filter & Search Toolbar -->
        <section id="filter-bar-container" class="controls-bar"></section>

        <!-- Views Container -->
        <section id="views-wrapper">
            <div id="property-grid" class="property-grid"></div>
            <div id="grouped-view-container" class="grouped-container" style="display: none;"></div>
            <div id="map-view-container" class="map-container" style="display: none;">
                <div id="leaflet-map"></div>
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <h3>No archived listings found</h3>
                <p>Try adjusting your search, property type, or location filters.</p>
            </div>
        </section>
    </main>

    <!-- Modals Container -->
    <div id="dossier-modal-container"></div>
    <div id="compare-modal-container"></div>
    <div id="archive-modal-container"></div>
    <div id="toast" class="toast"><span id="toast-msg"></span></div>

    <!-- ES6 Module Application Entry Point -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
